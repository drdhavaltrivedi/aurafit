# Forgot-password screen renders and validates (no reset email is sent to a real inbox).
appId: host.exp.Exponent
name: Forgot password
---
- runFlow: subflows/start.yaml
- tapOn:
    id: "welcome-login"
- tapOn:
    id: "login-forgot"
- assertVisible: "Reset password"
- takeScreenshot: 03_forgot
- tapOn:
    id: "forgot-submit"
- assertVisible: "Enter your email address."
- tapOn:
    id: "forgot-email"
- inputText: "bad-email"
- tapOn: "Reset password"  # dismiss keyboard
- tapOn:
    id: "forgot-submit"
- assertVisible: "Enter a valid email address."
- takeScreenshot: 03_forgot_invalid
- tapOn:
    id: "auth-back"
- tapOn:
    id: "auth-back"
- assertVisible:
    id: "welcome-login"
